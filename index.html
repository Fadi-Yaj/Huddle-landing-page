<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the icon logo of front end mentor -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./Assits/img/favicon-32x32.png"
    />

    <!-- Main Style File -->
    <link rel="stylesheet" href="./Assits/style/main-style.css" />
    <!-- Font Awesome Library -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Google Font -->
    <!-- Heading Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- rest of text Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Huddle landing page</title>
  </head>
  <body>
    <!-- Landing Page Structure -->
    <div class="container">
      <!-- Header -->
      <header>
        <!-- Logo -->
        <img src="./Assits/img/logo.svg" class="logo" alt="logo image" />
        <!-- the info about from where the design and how code it the design -->
        <div class="attribution">
          <button type="button" class="info-btn" id="infoToggleBtn">
            <i class="fas fa-gear"></i>
          </button>
          <div class="info-card" id="infoCard">
            <div class="line">
              <span class="badge">Challenge</span>
              <a href="https://www.frontendmentor.io?ref=challenge"
                >Frontend Mentor</a
              >
            </div>
            <div class="line">
              <span class="badge">Coded by</span>
              <a href="#">Fadi Yajouri</a>
            </div>
          </div>
        </div>
      </header>
      <!-- The Content -->
      <main>
        <img src="./Assits/img/illustration-mockups.svg" alt="img" />

        <div class="content-side">
          <h2 class="heading">Build The Community Your Fans Will Love</h2>
          <p>
            Huddle re-imagines the way we build communities. You have a voice,
            but so does your audience. Create connections with your users as you
            engage in genuine discussion.
          </p>
          <button type="button">Register</button>
        </div>
      </main>
      <!-- Footer Of Links -->
      <footer class="social-links">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
      </footer>
    </div>
    <script src="./Assits/js/main.js"></script>
  </body>
</html>
